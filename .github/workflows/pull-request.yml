name: PR checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rust_lint:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-C target-cpu=skylake'
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: setup sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
      - name: Install minimal stable with clippy and rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy
      - name: Cache apt packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /var/cache/apt/archives
          key: apt-rust-lint-${{ runner.os }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Format check
        working-directory: apps/readest-app/src-tauri
        run: cargo fmt --check
      - name: Clippy Check
        working-directory: apps/readest-app/src-tauri
        run: cargo clippy -p Readest --no-deps -- -D warnings

  build_web_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: activate and verify pinned pnpm
        run: |
          corepack install --global pnpm@11.21.0
          test "$(node --version)" = "v24.19.0"
          test "$(corepack pnpm --version)" = "11.21.0"

      - name: cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/readest-app/.next/cache
          key: nextjs-web-${{ github.sha }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-web-${{ github.sha }}-
            nextjs-web-

      - name: install Dependencies
        working-directory: apps/readest-app
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run setup-vendors

      - name: run format check
        run: corepack pnpm run format:check

      - name: install playwright browsers
        working-directory: apps/readest-app
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: run web tests
        working-directory: apps/readest-app
        run: corepack pnpm run test:pr:web

      - name: run lint
        working-directory: apps/readest-app
        run: corepack pnpm run lint

      - name: build the web app
        working-directory: apps/readest-app
        run: |
          corepack pnpm run build-web
          corepack pnpm run check:all

      - name: verify checks leave a clean tree
        run: |
          if test -n "$(git status --porcelain --untracked-files=all)"; then
            git status --short
            exit 1
          fi

  build_tauri_app:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: activate and verify pinned pnpm
        run: |
          corepack install --global pnpm@11.21.0
          test "$(node --version)" = "v24.19.0"
          test "$(corepack pnpm --version)" = "11.21.0"

      - name: cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/readest-app/.next/cache
          key: nextjs-tauri-${{ github.sha }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-tauri-${{ github.sha }}-
            nextjs-tauri-

      - name: install Dependencies
        working-directory: apps/readest-app
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm run setup-vendors

      - name: setup sccache
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11

      - name: install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          key: tauri-cargo
          cache-all-crates: 'true'

      - name: Cache apt packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /var/cache/apt/archives
          key: apt-tauri-${{ runner.os }}
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb

      - name: run tauri tests
        working-directory: apps/readest-app
        run: xvfb-run corepack pnpm run test:pr:tauri
